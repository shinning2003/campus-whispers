<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Whisper Room — Admin</title>
  <style>
    :root {
      --bg-dark: #0D0D0D;
      --bg-surface: #1A1A1A;
      --bg-card: #1E1E1E;
      --bg-elevated: #252525;
      --bg-input: #2A2A2A;
      --accent: #E53935;
      --accent-hover: #C62828;
      --text: #FFFFFF;
      --text-secondary: #AAAAAA;
      --text-muted: #888888;
      --border: #333333;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-surface) 100%);
      color: var(--text);
      min-height: 100vh;
    }
    .wrap { max-width: 680px; margin: 0 auto; padding: 0 16px 60px; }
    header { text-align: center; padding: 40px 16px 12px; }
    h1 { margin: 0; font-size: 1.5rem; }
    .sub { color: var(--text-muted); font-size: .85rem; margin-top: 4px; }
    .card { background: var(--bg-card); border-radius: var(--radius-md); padding: 18px; margin: 16px 0; }
    input, textarea { width: 100%; padding: 11px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border);
            background: var(--bg-input); color: var(--text); font-size: 1rem; outline: none; font-family: inherit; }
    input:focus, textarea:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 60px; }
    button { margin-top: 12px; background: var(--accent); color: #fff; border: 0;
             padding: 10px 18px; border-radius: var(--radius-sm); font-size: 1rem; cursor: pointer; }
    button:active { transform: scale(0.98); }
    .msg { color: var(--text-muted); font-size: .85rem; margin-top: 8px; min-height: 1em; }
    .item { background: var(--bg-elevated); border-radius: var(--radius-sm); padding: 12px 14px; margin: 10px 0;
            display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .item .body { flex: 1; }
    .item .meta { color: var(--text-muted); font-size: .75rem; margin-top: 6px; }
    .id { color: var(--accent); opacity: .8; }
    .del, .ban { background: #3a1a1a; color: var(--accent); border: 1px solid #5a2a2a; padding: 6px 14px; font-size: .85rem; }
    .give { background: #1f4a2e; color: #8ef0b0; border: 1px solid #235e37; padding: 6px 14px; font-size: .85rem; }
    .give:hover { background: #245a35; }
    .hidden { display: none; }
    .tabs { display: flex; gap: 0; border-bottom: 2px solid var(--border); margin-bottom: 12px; }
    .tabs button { flex: 1; margin: 0; padding: 10px; border-radius: 0; background: transparent;
                   color: var(--text-muted); font-size: .9rem; border-bottom: 2px solid transparent;
                   margin-bottom: -2px; cursor: pointer; }
    .tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
    a { color: var(--text-muted); text-decoration: none; font-size: .85rem; display: inline-block; margin-top: 8px; }
    a:hover { color: var(--text-secondary); }
    .foot { text-align: center; color: var(--text-dim); font-size: .8rem; padding: 24px 16px 40px; }
    .handle { color: var(--accent); font-weight: 600; }
    .active-badge { font-size: 10px; background: #22c55e; color: #fff; padding: 1px 6px; border-radius: 6px; margin-left: 6px; }
    .inactive-badge { font-size: 10px; background: #555; color: #aaa; padding: 1px 6px; border-radius: 6px; margin-left: 6px; }
    .create-area { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <header>
    <h1>Whisper Room — Admin</h1>
    <div class="sub">You see real names & handles. Ban anyone who misbehaves.</div>
  </header>
  <main class="wrap">
    <div class="card" id="loginCard">
      <input id="pw" type="password" placeholder="Admin password" />
      <button id="login">Unlock</button>
      <div class="msg" id="loginMsg"></div>
    </div>

    <div class="card hidden" id="dashCard">
      <div class="tabs">
        <button id="tabRumors" class="active">Rumors</button>
        <button id="tabUsers">Users</button>
        <button id="tabQuestions">Questions</button>
      </div>
      <div id="list"></div>
      <div id="userList" class="hidden"></div>
      <div id="questionList" class="hidden">
        <div class="create-area">
          <textarea id="questionInput" placeholder="Type a question for users..." maxlength="500"></textarea>
          <button id="createQuestion">Send Question</button>
          <div class="msg" id="questionMsg"></div>
        </div>
        <div id="questionsContainer"></div>
      </div>
      <a href="/">← Back to board</a>
    </div>
  </main>
  <footer class="foot">Whisper Room — B.Sc. &middot; Admin only.</footer>

  <script>
    const $ = id => document.getElementById(id);
    const api = (m,u,b)=>fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});
    function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

    $('login').onclick = async () => {
      const r = await api('POST','/api/admin/login',{password:$('pw').value});
      if (r.ok){ $('loginCard').classList.add('hidden'); $('dashCard').classList.remove('hidden'); loadRumors(); loadUsers(); loadQuestions(); }
      else { $('loginMsg').textContent = 'Wrong password.'; }
    };

    $('tabRumors').onclick = () => {
      $('tabRumors').classList.add('active'); $('tabUsers').classList.remove('active'); $('tabQuestions').classList.remove('active');
      $('list').classList.remove('hidden'); $('userList').classList.add('hidden'); $('questionList').classList.add('hidden');
    };
    $('tabUsers').onclick = () => {
      $('tabUsers').classList.add('active'); $('tabRumors').classList.remove('active'); $('tabQuestions').classList.remove('active');
      $('userList').classList.remove('hidden'); $('list').classList.add('hidden'); $('questionList').classList.add('hidden');
    };
    $('tabQuestions').onclick = () => {
      $('tabQuestions').classList.add('active'); $('tabRumors').classList.remove('active'); $('tabUsers').classList.remove('active');
      $('questionList').classList.remove('hidden'); $('list').classList.add('hidden'); $('userList').classList.add('hidden');
    };

    async function loadRumors() {
      const r = await api('GET','/api/admin/rumors');
      const data = await r.json();
      $('list').innerHTML = '';
      if (!data.rumors || !data.rumors.length) { $('list').innerHTML='<p class="msg">No whispers stored.</p>'; return; }
      for (const x of data.rumors) {
        const d = document.createElement('div'); d.className='item';
        d.innerHTML = `<div class="body">
          <div>${esc(x.text)}</div>
          <div class="meta"><span class="id">#${x.id}</span> · <span class="handle">@${esc(x.handle)}</span> · <span class="id">${esc(x.real_name)}</span> · ${new Date(x.created_at).toLocaleString()}</div></div>`;
        const b=document.createElement('button'); b.className='del'; b.textContent='Delete';
        b.onclick=async()=>{ await api('DELETE','/api/admin/rumors/'+x.id); loadRumors(); };
        d.appendChild(b); $('list').appendChild(d);
      }
    }

    async function loadUsers() {
      const r = await api('GET','/api/admin/users');
      const data = await r.json();
      $('userList').innerHTML = '';
      if (!data.users || !data.users.length) { $('userList').innerHTML='<p class="msg">No users.</p>'; return; }
      for (const u of data.users) {
        const d=document.createElement('div'); d.className='item';
        d.innerHTML=`<div class="body"><div><span class="handle">@${esc(u.handle)}</span>${u.banned?' <span class="id">[BANNED]</span>':''}</div>
          <div class="meta"><span class="id">${esc(u.real_name)}</span> · ${esc(u.email)} · ⭐ ${u.points || 0} pts</div></div>`;
        const btns = document.createElement('div');
        if (!u.banned) {
          const g=document.createElement('button'); g.className='give'; g.textContent='Give points';
          g.onclick=async()=>{
            const amt = prompt('How many points to give @' + u.handle + '?', '10');
            if (amt === null) return;
            const n = parseInt(amt, 10);
            if (!Number.isFinite(n) || n <= 0) { alert('Enter a positive number.'); return; }
            const rr = await api('POST', '/api/admin/users/' + u.id + '/grant-points', { amount: n });
            if (rr.ok) { await loadUsers(); }
            else { const e = await rr.json(); alert(e.error || 'Could not grant points'); }
          };
          btns.appendChild(g);
          const b=document.createElement('button'); b.className='ban'; b.textContent='Ban & remove';
          b.onclick=async()=>{ if(confirm('Ban '+u.real_name+'? All their posts will be deleted.')){ await api('DELETE','/api/admin/users/'+u.id); loadUsers(); loadRumors(); } };
          btns.appendChild(b);
        }
        d.appendChild(btns);
        $('userList').appendChild(d);
      }
    }

    /* ===== Questions ===== */
    $('createQuestion').onclick = async () => {
      const text = $('questionInput').value.trim();
      if (!text) { $('questionMsg').textContent = 'Enter a question.'; return; }
      $('questionMsg').textContent = '';
      const r = await api('POST', '/api/admin/questions', { text });
      if (r.ok) {
        $('questionInput').value = '';
        loadQuestions();
      } else {
        const e = await r.json();
        $('questionMsg').textContent = e.error || 'Failed to create question.';
      }
    };

    async function loadQuestions() {
      const r = await api('GET', '/api/admin/questions');
      const data = await r.json();
      const el = $('questionsContainer');
      el.innerHTML = '';
      if (!data.questions || !data.questions.length) {
        el.innerHTML = '<p class="msg">No questions sent yet.</p>';
        return;
      }
      for (const q of data.questions) {
        const d = document.createElement('div'); d.className = 'item';
        const statusBadge = q.active
          ? '<span class="active-badge">Active</span>'
          : '<span class="inactive-badge">Inactive</span>';
        d.innerHTML = `<div class="body">
          <div>${esc(q.question_text)} ${statusBadge}</div>
          <div class="meta">
            <span class="id">#${q.id}</span> ·
            ${new Date(q.created_at).toLocaleString()} ·
            <span class="handle">${q.answer_count} answer${q.answer_count !== 1 ? 's' : ''}</span>
          </div></div>`;
        const del = document.createElement('button'); del.className = 'del'; del.textContent = 'Delete';
        del.onclick = async () => {
          if (confirm('Delete this question and all its answers?')) {
            await api('DELETE', '/api/admin/questions/' + q.id);
            loadQuestions();
          }
        };
        d.appendChild(del);
        el.appendChild(d);
      }
    }
  </script>
</body>
</html>
